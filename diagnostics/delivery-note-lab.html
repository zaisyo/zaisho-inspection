<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>納品書OCR明細検証</title><style>body{font-family:system-ui;background:#eef3f7;color:#17304a;margin:0}main{max-width:760px;margin:auto;padding:16px}section{padding:16px;border-radius:12px;background:white;margin:12px 0}textarea{box-sizing:border-box;width:100%;min-height:180px;padding:10px;font:inherit}button{padding:10px 14px;border:0;background:#175c91;color:white;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left;overflow-wrap:anywhere}input{font:inherit}small{color:#556} .warn{color:#9c381d}</style></head><body><main><h1>納品書 明細OCR検証（開発版）</h1><section><p>納品書OCRの文字認識結果を貼り付け、品番・数量を同一行から抽出します。候補は必ず原本と照合してください。画像からの認識機能は次工程です。</p><textarea id="source" placeholder="品番 数量&#10;PTEC39 2個&#10;AB-12 3本"></textarea><p><button id="parse">明細候補を抽出</button></p><p id="status" role="status"></p></section><section><h2>一意に抽出された候補（未確認）</h2><table><thead><tr><th>行</th><th>品番</th><th>数量</th><th>原文</th></tr></thead><tbody id="accepted"></tbody></table><button id="export" disabled>候補CSVを保存</button><small>保存結果も未確認データです。正式な納品予定には自動登録されません。</small></section><section><h2>要確認・未抽出行</h2><div id="review" class="warn"></div></section></main><script type="module">
import {parseDeliveryLines,deliveryRowsToCsv} from '../src/ocr/delivery-note.mjs';
const $=id=>document.getElementById(id);let last=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('source').oninput=()=>{last=null;$('export').disabled=true;$('status').textContent='内容が変更されました。再抽出してください。'};
$('parse').onclick=()=>{last=parseDeliveryLines($('source').value);$('accepted').innerHTML=last.accepted.map(r=>'<tr><td>'+r.line+'</td><td>'+esc(r.part)+'</td><td>'+r.qty+'</td><td>'+esc(r.raw)+'</td></tr>').join('');$('review').textContent=last.review.map(x=>x.line+'行: '+x.reason+' / '+x.raw).join('\n');$('review').style.whiteSpace='pre-wrap';$('status').textContent='候補 '+last.accepted.length+'行、要確認 '+last.review.length+'行。すべて原本と照合してください。';$('export').disabled=!last.accepted.length};
$('export').onclick=()=>{if(!last?.accepted.length)return;if(!confirm('原本を確認しましたか？未確認候補としてCSVを出力します。'))return;const url=URL.createObjectURL(new Blob([deliveryRowsToCsv(last.accepted)],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='delivery-ocr-candidates.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
