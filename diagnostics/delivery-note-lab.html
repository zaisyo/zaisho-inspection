<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>納品書OCR明細検証</title><style>body{font-family:system-ui;background:#eef3f7;color:#17304a;margin:0}main{max-width:760px;margin:auto;padding:16px}section{padding:16px;border-radius:12px;background:white;margin:12px 0}textarea{box-sizing:border-box;width:100%;min-height:180px;padding:10px;font:inherit}button{padding:10px 14px;border:0;background:#175c91;color:white;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left;overflow-wrap:anywhere}input{font:inherit}small{color:#556} .warn{color:#9c381d}</style></head><body><main><h1>納品書 明細OCR検証（開発版）</h1><section><p>納品書OCRの文字認識結果を貼り付け、品番・数量を同一行から抽出します。候補は必ず原本と照合してください。写真の文字認識を試せます。PDFは未対応です。文字の読み取りと行の抽出は別処理で、すべて原本確認が必要です。</p><label>納品書の写真（JPG / PNG）<input id="image" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><p><button id="recognize" type="button">画像から文字を読み取る</button></p><p id="ocrStatus" role="status"></p><pre id="ocrTiming" style="white-space:pre-wrap"></pre><div><p>写真から列を指定：先に「品番列」または「数量列」を選び、写真上を左右になぞってください。</p><button id="selectPart" type="button">品番列を指定</button> <button id="selectQty" type="button">数量列を指定</button><p id="selectionStatus" role="status"></p><div id="imageStage" style="position:relative;display:inline-block;max-width:100%;touch-action:pan-y"><img id="imagePreview" alt="納品書写真" style="display:block;max-width:100%;max-height:520px"><div id="partOverlay" style="position:absolute;top:0;bottom:0;border:2px solid #079b78;background:#079b7833;pointer-events:none;display:none"></div><div id="qtyOverlay" style="position:absolute;top:0;bottom:0;border:2px solid #c27b13;background:#c27b1333;pointer-events:none;display:none"></div></div><label>品番列 X範囲（画像のピクセル）<input id="partRange" placeholder="例：200,700"></label><label>数量列 X範囲（画像のピクセル）<input id="qtyRange" placeholder="例：1100,1300"></label><small>列範囲の入力時のみ座標付き解析を行います。未入力なら従来の文字列抽出を表示します。</small></div><textarea id="source" placeholder="品番 数量&#10;PTEC39 2個&#10;AB-12 3本"></textarea><p><button id="parse">明細候補を抽出</button></p><p id="status" role="status"></p></section><section><h2>一意に抽出された候補（未確認）</h2><table><thead><tr><th>行</th><th>品番</th><th>数量</th><th>原文</th></tr></thead><tbody id="accepted"></tbody></table><button id="export" disabled>候補CSVを保存</button><small>保存結果も未確認データです。正式な納品予定には自動登録されません。</small></section><section><h2>要確認・未抽出行</h2><div id="review" class="warn"></div></section></main><script type="module">
import {parseDeliveryLines,deliveryRowsToCsv} from '../src/ocr/delivery-note.mjs';
import {collectOcrWords} from '../src/ocr/tesseract-adapter.mjs';
import {extractLayoutRows} from '../src/ocr/layout-rows.mjs';
import {columnPixels,displayRatio} from '../src/ocr/column-selection.mjs';
const $=id=>document.getElementById(id);let last=null,wordBoxes=[],worker=null,workerPromise=null,previewUrl=null,canvasWidth=0,selectedColumn='part',dragStart=null,columnRatios={part:null,qty:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function paintSelection(){for(const key of ['part','qty']){const v=columnRatios[key],el=$(key==='part'?'partOverlay':'qtyOverlay');el.style.display=v?'block':'none';if(v){el.style.left=(v[0]*100)+'%';el.style.width=((v[1]-v[0])*100)+'%'}}$('selectionStatus').textContent='指定中：'+(selectedColumn==='part'?'品番列':'数量列')+'。左右にドラッグして範囲を決定してください。'}
$('selectPart').onclick=()=>{selectedColumn='part';paintSelection()};
$('selectQty').onclick=()=>{selectedColumn='qty';paintSelection()};
$('image').onchange=()=>{const file=$('image').files?.[0];if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;wordBoxes=[];canvasWidth=0;columnRatios={part:null,qty:null};$('partRange').value='';$('qtyRange').value='';last=null;$('export').disabled=true;if(file){previewUrl=URL.createObjectURL(file);$('imagePreview').src=previewUrl}else $('imagePreview').removeAttribute('src');paintSelection()};
$('imageStage').onpointerdown=e=>{if(!$('imagePreview').naturalWidth)return;dragStart=displayRatio(e.clientX,$('imagePreview').getBoundingClientRect());$('imageStage').setPointerCapture(e.pointerId)};
$('imageStage').onpointerup=e=>{if(dragStart===null)return;const end=displayRatio(e.clientX,$('imagePreview').getBoundingClientRect());const a=Math.min(dragStart,end),b=Math.max(dragStart,end);dragStart=null;if(b-a<.01){$('selectionStatus').textContent='列の幅をもう少し広く指定してください';return}columnRatios[selectedColumn]=[a,b];if(canvasWidth>0){try{$(selectedColumn==='part'?'partRange':'qtyRange').value=columnPixels(a,b,canvasWidth).join(',')}catch(e){$('selectionStatus').textContent=String(e)}}paintSelection();if(wordBoxes.length)$('parse').click()};
$('imageStage').onpointercancel=()=>{dragStart=null};
async function getWorker(){if(worker)return worker;if(workerPromise)return workerPromise;workerPromise=(async()=>{if(!globalThis.Tesseract){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.onload=resolve;script.onerror=()=>reject(Error('OCRライブラリを読み込めません'));document.head.append(script)})}return Tesseract.createWorker('jpn+eng',1)})();try{worker=await workerPromise;return worker}finally{workerPromise=null}}
async function makeCanvas(file){const bitmap=await createImageBitmap(file);try{const edge=2200,scale=Math.min(1,edge/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);return canvas}finally{bitmap.close()}}
$('recognize').onclick=async()=>{const file=$('image').files?.[0];if(!file){$('ocrStatus').textContent='写真を選択してください';return}if(file.type==='application/pdf'){$('ocrStatus').textContent='PDFは未対応です。ページ画像に変換してください';return}if(file.size>15_000_000){$('ocrStatus').textContent='画像は15MB以下にしてください';return}
const button=$('recognize'),start=performance.now(),times={};button.disabled=true;last=null;$('export').disabled=true;try{
$('ocrStatus').textContent='画像を準備中';let t=performance.now();const canvas=await makeCanvas(file);canvasWidth=canvas.width;for(const key of ['part','qty']){const r=columnRatios[key];if(r)$(key==='part'?'partRange':'qtyRange').value=columnPixels(r[0],r[1],canvasWidth).join(',')}times.decodeMs=Math.round(performance.now()-t);
$('ocrStatus').textContent='OCRエンジンを準備中';t=performance.now();const engine=await getWorker();times.initMs=Math.round(performance.now()-t);
$('ocrStatus').textContent='文字認識中';t=performance.now();const result=await engine.recognize(canvas,{}, {blocks:true});times.recognizeMs=Math.round(performance.now()-t);
if($('image').files?.[0]!==file)throw Error('画像が途中で変更されました');
wordBoxes=collectOcrWords(result.data);$('source').value=result.data.text||'';$('parse').click();times.totalMs=Math.round(performance.now()-start);
$('ocrTiming').textContent=JSON.stringify(times,null,2);
$('ocrStatus').textContent='文字認識が終了しました。品番・数量と行対応を原本で確認してください';
}catch(e){$('ocrStatus').textContent='OCR失敗: '+String(e)}finally{button.disabled=false}};
$('source').oninput=()=>{wordBoxes=[];last=null;$('export').disabled=true;$('status').textContent='内容が変更されました。再抽出してください。'};
function getRange(id){const raw=$(id).value.trim();if(!raw)return null;const parts=raw.split(',').map(x=>Number(x.trim()));if(parts.length!==2||!parts.every(Number.isFinite)||parts[0]<0||parts[0]>=parts[1])throw Error(id+'には開始X,終了Xを指定してください');return parts}
$('parse').onclick=()=>{try{
 const p=getRange('partRange'),q=getRange('qtyRange');const useLayout=Boolean(p&&q);
 if(Boolean(p)!==Boolean(q))throw Error('品番列と数量列の両方を指定してください');
 if(useLayout&&wordBoxes.length){
 const extracted=extractLayoutRows(wordBoxes,{partColumn:p,quantityColumn:q});
 last={accepted:extracted.candidates.map((r,i)=>({...r,line:i+1,raw:'座標行 Y='+Math.round(r.rowY),name:''})),review:extracted.review.map(x=>({line:Math.round(x.rowY),raw:x.part,reason:x.reason}))};
 }else{last=parseDeliveryLines($('source').value)}
 $('accepted').innerHTML=last.accepted.map(r=>'<tr><td>'+r.line+'</td><td>'+esc(r.part)+'</td><td>'+r.qty+'</td><td>'+esc(r.raw)+'</td></tr>').join('');
 $('review').textContent=last.review.map(x=>x.line+'行: '+x.reason+' / '+x.raw).join('\n');$('review').style.whiteSpace='pre-wrap';
 $('status').textContent=(useLayout?(wordBoxes.length?'座標解析':'座標なし・文字列解析へ切替'):'文字列解析')+'：候補 '+last.accepted.length+'行、要確認 '+last.review.length+'行。すべて原本確認が必要です。';$('export').disabled=!last.accepted.length;
 }catch(e){last=null;$('export').disabled=true;$('status').textContent='抽出できません: '+String(e)}
};
$('export').onclick=()=>{if(!last?.accepted.length)return;if(!confirm('原本を確認しましたか？未確認候補としてCSVを出力します。'))return;const url=URL.createObjectURL(new Blob([deliveryRowsToCsv(last.accepted)],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='delivery-ocr-candidates.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
