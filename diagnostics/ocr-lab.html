<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>検品 OCR 診断ラボ（開発用）</title>
<style>body{font-family:system-ui,sans-serif;background:#f3f6f9;color:#14283d;margin:0}main{max-width:800px;margin:auto;padding:16px}section{background:white;border-radius:12px;padding:16px;margin:12px 0}label{display:block;margin:12px 0}button,input,select{font:inherit;padding:8px}button{background:#195d97;color:white;border:0;border-radius:8px}button:disabled{opacity:.4}#stage{position:relative;display:inline-block;touch-action:none;max-width:100%}#photo{display:block;max-width:100%;max-height:55vh}#region{position:absolute;border:3px solid #00b878;background:#00b87825;pointer-events:none;box-sizing:border-box}textarea{width:100%;min-height:100px;box-sizing:border-box}#cropped{max-width:100%;border:1px solid #ddd}small{color:#526175}</style></head><body><main><h1>商品品番専用 OCR 診断</h1><p>品番のみを細く切り出す前提の英数字専用設定です。納品書の日本語OCRには使用しません。認識できなければ要確認とし、自動検品しません。</p><p>本番と独立した開発用ページです。画像・認識結果はサーバーへ送信しません（OCRライブラリの初期ダウンロードにはネット接続が必要）。診断ログは明示的に保存した場合のみファイルになります。</p>
<section><label>写真を選択 <input id="file" type="file" accept="image/*"></label><p>画像上を指でなぞって品番の範囲を四角く囲んでください。初期状態では画像全体を使います。</p><div id="stage"><img id="photo" alt="選択画像"><div id="region"></div></div><p id="coords"></p><label>比較方式 <select id="mode"><option value="both">切り出し画像：無補正とグレースケールを比較</option><option value="raw">切り出し画像：無補正のみ</option></select></label><label>正解品番（任意・目視で確認したもの）<input id="expected" autocomplete="off" placeholder="例：PTEC39"></label><button id="reset" type="button">選択範囲を全体に戻す</button> <button id="run" disabled>OCR診断を実行</button></section>
<section><h2>切り出した画像</h2><img id="cropped" alt="切り出し範囲のプレビュー"><h2>認識結果</h2><textarea id="output" readonly></textarea><pre id="timing"></pre><button id="save" disabled>診断JSON保存（文字列を含まない）</button><label><input id="includeText" type="checkbox">認識文字列も保存する（個人情報に注意）</label><p><small>文字列保存を選択した場合のみ、OCRで抽出した文字列も含まれます。社外共有前に個人情報を確認・削除してください。</small></p></section></main>
<script type="module">
import {normalizeRect,renderRegion,candidateStatus,makeTimings} from '../src/ocr/diagnostics.mjs';
import {evaluateRecognition,safeDiagnosticExport} from '../src/ocr/evaluation.mjs';
const $=id=>document.getElementById(id);let file=null,url=null,roi={x:0,y:0,w:1,h:1},worker=null,report=null,start=null;
function draw(){const r=$('photo').getBoundingClientRect();$('region').style.left=(roi.x*100)+'%';$('region').style.top=(roi.y*100)+'%';$('region').style.width=(roi.w*100)+'%';$('region').style.height=(roi.h*100)+'%';$('coords').textContent='切り出し比率 '+JSON.stringify(roi)}
$('file').onchange=()=>{file=$('file').files[0];if(url)URL.revokeObjectURL(url);if(!file)return;url=URL.createObjectURL(file);$('photo').src=url;roi={x:0,y:0,w:1,h:1};$('photo').onload=draw;$('run').disabled=false;$('save').disabled=true};
$('reset').onclick=()=>{roi={x:0,y:0,w:1,h:1};draw()};
function pos(e){const b=$('photo').getBoundingClientRect();return {x:Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)),y:Math.max(0,Math.min(1,(e.clientY-b.top)/b.height))}}
$('stage').onpointerdown=e=>{if(!file)return;start=pos(e);$('stage').setPointerCapture(e.pointerId)};
$('stage').onpointermove=e=>{if(!start)return;const p=pos(e),x=Math.min(p.x,start.x),y=Math.min(p.y,start.y),w=Math.abs(p.x-start.x),h=Math.abs(p.y-start.y);if(w>.005&&h>.005){roi=normalizeRect({x,y,w,h});draw()}};
$('stage').onpointerup=()=>{start=null};
async function ensureWorker(){if(worker)return worker;const t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';await new Promise((resolve,reject)=>{t.onload=resolve;t.onerror=()=>reject(Error('OCRライブラリの取得失敗'));document.head.append(t)});worker=await globalThis.Tesseract.createWorker('eng');await worker.setParameters({tessedit_pageseg_mode:globalThis.Tesseract.PSM.SINGLE_LINE,tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-./_'});return worker}
$('run').onclick=async()=>{if(!file)return;$('run').disabled=true;$('save').disabled=true;const measure=makeTimings(),times={},results=[];try{measure.start('init');const w=await ensureWorker();times.init=measure.end('init');for(const gray of ($('mode').value==='both'?[false,true]:[false])){measure.start('render');const v=await renderRegion(file,roi,{gray});times[gray?'grayRender':'plainRender']=measure.end('render');$('cropped').src=v.canvas.toDataURL('image/png');measure.start('ocr');const r=await w.recognize(v.canvas);times[gray?'grayOcr':'plainOcr']=measure.end('ocr');results.push({variant:gray?'gray':'plain',text:r.data.text||'',candidate:candidateStatus(r.data.text),evaluation:evaluateRecognition(r.data.text,$('expected').value),image:v.source,crop:v.crop,output:v.output})}report={version:1,date:new Date().toISOString(),timingsMs:times,results};$('output').value=results.map(x=>x.variant+'\n'+x.text+'\n候補:'+x.candidate.matches.join(',')+'\n正解評価:'+x.evaluation.status).join('\n------\n');$('timing').textContent=JSON.stringify(times,null,2);$('save').disabled=false}catch(e){$('output').value='診断失敗: '+String(e);$('timing').textContent='エラー'}finally{$('run').disabled=false}};
$('save').onclick=()=>{if(!report)return;if($('includeText').checked&&!confirm('認識結果の文字列に個人情報が含まれていないことを確認しましたか？'))return;const blob=new Blob([JSON.stringify(safeDiagnosticExport(report,{includeRecognizedText:$('includeText').checked}),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ocr-diagnostic.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
