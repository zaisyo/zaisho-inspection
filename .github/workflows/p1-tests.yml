name: Inspection regression tests
on:
  pull_request:
  push:
    branches:
      - development/p0-baseline-20261031
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: OCR ROI and candidate unit tests
        run: node --test tests/ocr-diagnostics.test.mjs
      - name: Baseline source structure
        run: node scripts/baseline_audit.mjs
