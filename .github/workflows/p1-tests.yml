name: Inspection regression tests
on:
  pull_request:
  push:
    branches:
      - development/p0-baseline-20261031
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every regression test
        run: node --test tests/*.test.mjs
      - name: Validate diagnostic page JS syntax
        run: node scripts/check-ui-syntax.mjs
      - name: Baseline source structure
        run: node scripts/baseline_audit.mjs
      - name: Package and verify diagnostic preview
        if: github.ref == 'refs/heads/development/p0-baseline-20261031' || github.head_ref == 'development/p0-baseline-20261031'
        run: |
          mkdir -p preview/diagnostics preview/src/ocr preview/src/intake preview/src/storage
          cp diagnostics/index.html preview/index.html
          cp diagnostics/ocr-lab.html diagnostics/intake-lab.html diagnostics/delivery-note-lab.html preview/diagnostics/
          cp src/ocr/*.mjs preview/src/ocr/
          cp src/intake/*.mjs preview/src/intake/
          cp src/storage/*.mjs preview/src/storage/
          printf '%s\n' 'Development diagnostics only. Serve over HTTPS or localhost.' > preview/README.txt
          node scripts/verify-preview.mjs preview
      - name: Upload verified preview ZIP
        if: github.ref == 'refs/heads/development/p0-baseline-20261031' || github.head_ref == 'development/p0-baseline-20261031'
        uses: actions/upload-artifact@v4
        with:
          name: inspection-development-preview
          path: preview/
          if-no-files-found: error
          retention-days: 14
